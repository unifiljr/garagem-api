<!DOCTYPE html>
<html>
<head>
    <title>Cadastrar Veículo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #0f172a;
            color: white;
        }

        .sidebar {
            height: 100vh;
            width: 220px;
            position: fixed;
            background-color: #020617;
            padding: 20px;
        }

            .sidebar a {
                display: block;
                color: #94a3b8;
                padding: 10px;
                text-decoration: none;
                border-radius: 8px;
            }

                .sidebar a:hover {
                    background-color: #1e293b;
                    color: white;
                }

        .content {
            margin-left: 240px;
            padding: 20px;
        }

        .card-custom {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 25px;
            max-width: 600px;
        }

        .btn-custom {
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h4>🚗 AutoDealer</h4>

        <a href="dashboard.html">Painel</a>
        <a href="cadastro.html">Cadastrar Veículo</a>
        <a href="lista.html">Lista de Veículos</a>
        <a href="fipe.html">Consulta FIPE</a>

    </div>

    <div class="content">

        <h3>Cadastrar Novo Veículo</h3>
        <p class="text-secondary">Adicione um novo veículo ao estoque</p>

        <div class="card-custom mt-4">

            <input type="hidden" id="id">

            <div class="row">
                <div class="col">
                    <label>Marca</label>
                    <input class="form-control" id="marca">
                </div>

                <div class="col">
                    <label>Modelo</label>
                    <input class="form-control" id="modelo">
                </div>
            </div>

            <div class="row mt-3">
                <div class="col">
                    <label>Ano</label>
                    <input class="form-control" id="ano">
                </div>

                <div class="col">
                    <label>Preço</label>
                    <input class="form-control" id="preco">
                </div>
            </div>

            <div class="mt-3">
                <label>Status</label>
                <select class="form-control" id="status">
                    <option value="1">Disponível</option>
                    <option value="2">Vendido</option>
                    <option value="3">Pendente</option>
                    <option value="4">Manutenção</option>
                </select>
            </div>

            <div class="mt-4 d-flex gap-2">
                <button class="btn btn-secondary btn-custom" onclick="cancelar()">Cancelar</button>
                <button class="btn btn-danger btn-custom" onclick="salvar()">Salvar</button>
            </div>

        </div>

    </div>

    <script>

const api = "https://localhost:7001/api/carros";

function carregarEdicao() {
    const carro = localStorage.getItem("carroEditar");

    if (carro) {
        const c = JSON.parse(carro);

        document.getElementById("id").value = c.id;
        document.getElementById("marca").value = c.marca;
        document.getElementById("modelo").value = c.modelo;
        document.getElementById("ano").value = c.ano;
        document.getElementById("preco").value = c.preco;
        document.getElementById("status").value = c.status;

        localStorage.removeItem("carroEditar");
    }
}

async function salvar() {

    const idValue = document.getElementById("id").value;

    const carro = {
        marca: document.getElementById("marca").value,
        modelo: document.getElementById("modelo").value,
        ano: parseInt(document.getElementById("ano").value),
        preco: parseFloat(document.getElementById("preco").value),
        statusId: parseInt(document.getElementById("status").value)
    };

   
    if (idValue) {
        carro.id = parseInt(idValue);
    }
    if (carro.id) {
        await fetch(api + "/" + carro.id, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(carro)
        });
    } else {
        await fetch(api, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(carro)
        });
    }

    window.location.href = "lista.html";
}

function cancelar() {
    window.location.href = "lista.html";
}

carregarEdicao();

    </script>

</body>
</html>
