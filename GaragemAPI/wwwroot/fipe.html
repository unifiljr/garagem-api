<!DOCTYPE html>
<html>
<head>
    <title>Consulta FIPE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #0f172a;
            color: white;
        }

        .sidebar {
            height: 100vh;
            width: 220px;
            position: fixed;
            background-color: #020617;
            padding: 20px;
        }

            .sidebar a {
                display: block;
                color: #94a3b8;
                padding: 10px;
                text-decoration: none;
                border-radius: 8px;
            }

                .sidebar a:hover {
                    background-color: #1e293b;
                    color: white;
                }

        .content {
            margin-left: 240px;
            padding: 20px;
        }

        .card-custom {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 25px;
            max-width: 600px;
        }

        .btn-custom {
            border-radius: 10px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }

            .modal-overlay.show {
                display: flex;
            }

        .modal-box {
            background: #1a2332;
            border: 1px solid #2a3547;
            border-radius: 12px;
            padding: 32px;
            max-width: 360px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: modalPop 0.2s ease-out;
        }

        @keyframes modalPop {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .modal-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 8px 0;
        }

        .modal-text {
            color: #9aa5b1;
            font-size: 14px;
            margin: 0 0 24px 0;
            line-height: 1.5;
        }

        .modal-btn {
            background: #dc3545;
            color: #ffffff;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

            .modal-btn:hover {
                background: #c3303f;
            }
    </style>
</head>

<body>

    <div class="sidebar">
        <h4>🚗 AutoDealer</h4>

        <a href="dashboard.html">Painel</a>
        <a href="cadastro.html">Cadastrar Veículo</a>
        <a href="lista.html">Lista de Veículos</a>
        <a href="fipe.html">Consulta FIPE</a>
    </div>

    <div id="modalAlerta" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon">⚠️</div>
            <h3 class="modal-title">Campos obrigatórios</h3>
            <p id="modalMensagem" class="modal-text">Por favor, selecione todos os campos obrigatórios.</p>
            <button class="modal-btn" onclick="fecharModal()">Entendi</button>
        </div>
    </div>

    <div id="modalConfirmar" class="modal-overlay">
        <div class="modal-box">
            <h3 class="modal-title">Confirmar cadastro</h3>
            <p class="modal-text text-start">
                <strong>Marca:</strong> <span id="confMarca"></span><br>
                <strong>Modelo:</strong> <span id="confModelo"></span><br>
                <strong>Ano:</strong> <span id="confAno"></span><br>
                <strong>Preço:</strong> <span id="confPreco"></span>
            </p>
            <p class="modal-text">Deseja cadastrar este veículo no sistema?</p>
            <div class="d-flex gap-2 justify-content-center">
                <button class="btn btn-secondary btn-custom" onclick="fecharModalConfirmar()">Cancelar</button>
                <button class="modal-btn" onclick="confirmarCadastro()">Sim, cadastrar</button>
            </div>
        </div>
    </div>

    <div class="content">

        <h3>Consulta FIPE</h3>
        <p class="text-secondary">Consulte o valor atualizado do veículo</p>

        <div class="card-custom mt-4">

            <div class="row">
                <div class="col">
                    <label>Marca</label>
                    <select class="form-control" id="marca"></select>
                </div>

                <div class="col">
                    <label>Modelo</label>
                    <select class="form-control" id="modelo"></select>
                </div>
            </div>

            <div class="row mt-3">
                <div class="col">
                    <label>Ano</label>
                    <select class="form-control" id="ano"></select>
                </div>

                <div class="col d-flex align-items-end">
                    <button class="btn btn-danger btn-custom w-100" onclick="buscarPreco()">
                        Buscar Preço
                    </button>
                </div>
            </div>

            <div class="mt-4">
                <label>Valor FIPE</label>
                <input class="form-control" id="valorFipe" readonly>
            </div>

            <div class="mt-4 text-end">
                <button class="btn btn-danger btn-custom" id="btnCadastrar" onclick="abrirModalCadastro()" disabled>
                    Cadastrar veículo no sistema
                </button>
            </div>

        </div>

    </div>

    <script>
        const baseUrl = "https://parallelum.com.br/fipe/api/v1/carros";
        const apiCarros = "https://garagem-api-bbqq.onrender.com/api/carros";
        let ultimoResultadoFipe = null;

        async function carregarMarcas() {
            const res = await fetch(`${baseUrl}/marcas`);
            const data = await res.json();

            const select = document.getElementById("marca");
            select.innerHTML = '<option>Selecione</option>';

            data.forEach(m => {
                select.innerHTML += `<option value="${m.codigo}">${m.nome}</option>`;
            });
        }

        async function carregarModelos() {
            const marcaId = document.getElementById("marca").value;

            const res = await fetch(`${baseUrl}/marcas/${marcaId}/modelos`);
            const data = await res.json();

            const select = document.getElementById("modelo");
            select.innerHTML = '<option>Selecione</option>';

            data.modelos.forEach(m => {
                select.innerHTML += `<option value="${m.codigo}">${m.nome}</option>`;
            });
        }

        async function carregarAnos() {
            const marcaId = document.getElementById("marca").value;
            const modeloId = document.getElementById("modelo").value;

            const res = await fetch(`${baseUrl}/marcas/${marcaId}/modelos/${modeloId}/anos`);
            const data = await res.json();

            const select = document.getElementById("ano");
            select.innerHTML = '<option>Selecione</option>';

            data.forEach(a => {
                select.innerHTML += `<option value="${a.codigo}">${a.nome}</option>`;
            });
        }

        function nomeSelecionado(id) {
            const select = document.getElementById(id);
            return select.options[select.selectedIndex]?.text || "";
        }

        function abrirModal(mensagem) {
            document.getElementById("modalMensagem").innerText = mensagem;
            document.getElementById("modalAlerta").classList.add("show");
        }

        function fecharModal() {
            document.getElementById("modalAlerta").classList.remove("show");
        }

        async function buscarPreco() {
            const marcaId = document.getElementById("marca").value;
            const modeloId = document.getElementById("modelo").value;
            const ano = document.getElementById("ano").value;

            if (!marcaId || !modeloId || !ano) {
                abrirModal("Por favor, selecione todos os campos obrigatórios: Marca, Modelo e Ano.");
                return;
            }

            const res = await fetch(`${baseUrl}/marcas/${marcaId}/modelos/${modeloId}/anos/${ano}`);
            const data = await res.json();
            document.getElementById("valorFipe").value = data.Valor;

            ultimoResultadoFipe = {
                marca: nomeSelecionado("marca"),
                modelo: nomeSelecionado("modelo"),
                ano: parseInt(data.AnoModelo) || parseInt(ano),
                preco: parseFloat(data.Valor.replace("R$", "").trim().replace(/\./g, "").replace(",", "."))
            };

            document.getElementById("btnCadastrar").disabled = false;
        }

        function abrirModalCadastro() {
            if (!ultimoResultadoFipe) return;

            document.getElementById("confMarca").innerText = ultimoResultadoFipe.marca;
            document.getElementById("confModelo").innerText = ultimoResultadoFipe.modelo;
            document.getElementById("confAno").innerText = ultimoResultadoFipe.ano;
            document.getElementById("confPreco").innerText = document.getElementById("valorFipe").value;

            document.getElementById("modalConfirmar").classList.add("show");
        }

        function fecharModalConfirmar() {
            document.getElementById("modalConfirmar").classList.remove("show");
        }

        async function confirmarCadastro() {
            const carro = {
                marca: ultimoResultadoFipe.marca,
                modelo: ultimoResultadoFipe.modelo,
                ano: ultimoResultadoFipe.ano,
                preco: ultimoResultadoFipe.preco,
                statusId: 1 // Disponível
            };

            await fetch(apiCarros, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(carro)
            });

            window.location.href = "lista.html";
        }

        document.getElementById("marca").addEventListener("change", carregarModelos);
        document.getElementById("modelo").addEventListener("change", carregarAnos);

        carregarMarcas();
    </script>

</body>
</html>
