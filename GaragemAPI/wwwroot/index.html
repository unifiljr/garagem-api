<!DOCTYPE html>
<html>
<head>
    <title>Garagem</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-4">

        <h2 class="mb-4">🚗 Sistema de Garagem</h2>

        <!-- 📊 ESTATÍSTICAS -->
        <div class="row mb-4">
            <div class="col">
                <div class="card p-3">Total: <span id="total"></span></div>
            </div>
            <div class="col">
                <div class="card p-3">Disponíveis: <span id="disponiveis"></span></div>
            </div>
            <div class="col">
                <div class="card p-3">Vendidos: <span id="vendidos"></span></div>
            </div>
            <div class="col">
                <div class="card p-3">Valor Total: R$ <span id="valorTotal"></span></div>
            </div>
        </div>

        <!-- 📝 FORMULÁRIO -->
        <div class="card p-3 mb-4">
            <h5>Cadastrar / Editar Carro</h5>

            <input type="hidden" id="id">

            <div class="row">
                <div class="col"><input class="form-control" id="marca" placeholder="Marca"></div>
                <div class="col"><input class="form-control" id="modelo" placeholder="Modelo"></div>
                <div class="col"><input class="form-control" id="ano" placeholder="Ano"></div>
            </div>

            <div class="row mt-2">
                <div class="col"><input class="form-control" id="cor" placeholder="Cor"></div>
                <div class="col"><input class="form-control" id="preco" placeholder="Preço"></div>
                <div class="col">
                    <select class="form-control" id="status">
                        <option value="Disponivel">Disponível</option>
                        <option value="Vendido">Vendido</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-primary mt-3" onclick="salvar()">Salvar</button>
        </div>

        <!-- 🔍 BUSCA -->
        <input class="form-control mb-3" placeholder="Buscar por marca ou modelo" onkeyup="filtrar(this.value)">

        <!-- 📋 TABELA -->
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Ano</th>
                    <th>Preço</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>

    </div>

    <script>

        const api = "https://garagem-api-bbqq.onrender.com/api/carros";
        let carros = [];

        async function carregar() {
            const res = await fetch(api);
            carros = await res.json();

            renderizar(carros);
            atualizarStats();
        }

        function renderizar(lista) {
            let html = "";

            lista.forEach(c => {
                html += `
            <tr>
                <td>${c.marca}</td>
                <td>${c.modelo}</td>
                <td>${c.ano}</td>
                <td>R$ ${c.preco}</td>
                <td>${c.status}</td>
                <td>
                    <button class="btn btn-warning btn-sm" onclick='editar(${JSON.stringify(c)})'>Editar</button>
                    <button class="btn btn-danger btn-sm" onclick="deletar(${c.id})">Excluir</button>
                    <button class="btn btn-success btn-sm" onclick="vender(${c.id})">Vender</button>
                </td>
            </tr>`;
            });

            document.getElementById("lista").innerHTML = html;
        }

        function atualizarStats() {
            document.getElementById("total").innerText = carros.length;
            document.getElementById("disponiveis").innerText = carros.filter(c => c.status === "Disponivel").length;
            document.getElementById("vendidos").innerText = carros.filter(c => c.status === "Vendido").length;

            let total = carros.reduce((soma, c) => soma + c.preco, 0);
            document.getElementById("valorTotal").innerText = total.toFixed(2);
        }

        async function salvar() {
            const carro = {
                id: document.getElementById("id").value,
                marca: document.getElementById("marca").value,
                modelo: document.getElementById("modelo").value,
                ano: parseInt(document.getElementById("ano").value),
                cor: document.getElementById("cor").value,
                preco: parseFloat(document.getElementById("preco").value),
                status: document.getElementById("status").value
            };

            if (carro.id) {
                await fetch(api + "/" + carro.id, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(carro)
                });
            } else {
                await fetch(api, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(carro)
                });
            }

            limpar();
            carregar();
        }

        function editar(c) {
            document.getElementById("id").value = c.id;
            document.getElementById("marca").value = c.marca;
            document.getElementById("modelo").value = c.modelo;
            document.getElementById("ano").value = c.ano;
            document.getElementById("cor").value = c.cor;
            document.getElementById("preco").value = c.preco;
            document.getElementById("status").value = c.status;
        }

        async function deletar(id) {
            if (!confirm("Deseja excluir?")) return;

            await fetch(api + "/" + id, { method: "DELETE" });
            carregar();
        }

        async function vender(id) {
            const carro = carros.find(c => c.id === id);
            carro.status = "Vendido";

            await fetch(api + "/" + id, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(carro)
            });

            carregar();
        }

        function limpar() {
            document.getElementById("id").value = "";
            document.getElementById("marca").value = "";
            document.getElementById("modelo").value = "";
            document.getElementById("ano").value = "";
            document.getElementById("cor").value = "";
            document.getElementById("preco").value = "";
        }

        function filtrar(valor) {
            valor = valor.toLowerCase();

            const filtrados = carros.filter(c =>
                c.marca.toLowerCase().includes(valor) ||
                c.modelo.toLowerCase().includes(valor)
            );

            renderizar(filtrados);
        }

        carregar();

    </script>

</body>
</html>
