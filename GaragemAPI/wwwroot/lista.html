<!DOCTYPE html>
<html>
<head>
    <title>Lista de Veículos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #0f172a;
            color: white;
        }

        .sidebar {
            height: 100vh;
            width: 220px;
            position: fixed;
            background-color: #020617;
            padding: 20px;
        }

            .sidebar a {
                display: block;
                color: #94a3b8;
                padding: 10px;
                text-decoration: none;
                border-radius: 8px;
            }

                .sidebar a:hover {
                    background-color: #1e293b;
                    color: white;
                }

        .content {
            margin-left: 240px;
            padding: 20px;
        }

        .card-custom {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
        }

        .status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .disponivel {
            background-color: #16a34a;
        }

        .vendido {
            background-color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h4>🚗 AutoDealer</h4>

        <a href="dashboard.html">Painel</a>
        <a href="cadastro.html">Cadastrar Veículo</a>
        <a href="lista.html">Lista de Veículos</a>
        <a href="fipe.html">Consulta FIPE</a>

    </div>

    <div class="content">

        <h3>Estoque de Veículos</h3>
        <p class="text-secondary">Gerencie seus veículos cadastrados</p>

        <!-- 🔍 BUSCA -->
        <input class="form-control mb-3" placeholder="Buscar por marca ou modelo" onkeyup="filtrar(this.value)">

        <!-- 📋 TABELA -->
        <div class="card-custom">
            <table class="table table-dark table-hover">
                <thead>
                    <tr>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Ano</th>
                        <th>Preço</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista"></tbody>
            </table>
        </div>

    </div>

    <script>

const api = "https://localhost:7001/api/carros";
let carros = [];

async function carregar() {
    const res = await fetch(api);
    carros = await res.json();

    renderizar(carros);
}

function renderizar(lista) {
    let html = "";

    lista.forEach(c => {

        let statusClass = c.status === "Disponivel" ? "disponivel" : "vendido";

        html += `
        <tr>
            <td>${c.marca}</td>
            <td>${c.modelo}</td>
            <td>${c.ano}</td>
            <td>R$ ${c.preco}</td>
            <td><span class="status ${statusClass}">${c.statusDescricao}</span></td>
            <td>
                <button class="btn btn-warning btn-sm" onclick='editar(${JSON.stringify(c)})'>Editar</button>
                <button class="btn btn-danger btn-sm" onclick="deletar(${c.id})">Excluir</button>
                <button class="btn btn-success btn-sm" onclick="vender(${c.id})">Vender</button>
            </td>
        </tr>`;
    });

    document.getElementById("lista").innerHTML = html;
}

function filtrar(valor) {
    valor = valor.toLowerCase();

    const filtrados = carros.filter(c =>
        c.marca.toLowerCase().includes(valor) ||
        c.modelo.toLowerCase().includes(valor)
    );

    renderizar(filtrados);
}

async function deletar(id) {
    if (!confirm("Deseja excluir?")) return;

    await fetch(api + "/" + id, { method: "DELETE" });
    carregar();
}

async function vender(id) {
    const carro = carros.find(c => c.id === id);
    carro.status = "Vendido";

    await fetch(api + "/" + id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(carro)
    });

    carregar();
}

function editar(c) {
    localStorage.setItem("carroEditar", JSON.stringify(c));
    window.location.href = "cadastro.html";
}

carregar();

    </script>

</body>
</html>
